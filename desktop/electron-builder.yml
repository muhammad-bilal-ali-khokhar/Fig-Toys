appId: com.fig.toys
productName: Fig Toys
copyright: Copyright © 2026 MYKO Pvt Ltd. All rights reserved.
directories:
  output: release
  buildResources: build

files:
  - main.js
  - preload.js
  - updater-preload.js
  - logging.js
  - report.js
  - loading.html
  - about.html
  - updater.html
  - icon.png
  - license-public.pem
  - spalsh_1.png
  - spalsh_2.png
  - error.html
  - runtime.json
  - cloud.json
  - package.json

# Bundle the production builds (no source, no node_modules except the native
# module bundled inside production/backend/native).
extraResources:
  - from: ../production/backend
    to: production/backend
    filter:
      - "**/*"
  - from: ../production/frontend
    to: production/frontend
    filter:
      - "**/*"

npmRebuild: true

# Windows is the only release target. macOS is not built or released.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: Fig-Toys-Setup-${version}.${ext}

publish:
  provider: generic
  url: https://download.myko.pk/toys/

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Fig POS
  installerSidebar: build/installerSidebar.bmp
  installerHeaderIcon: build/installerHeaderIcon.ico
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
  runAfterFinish: true
