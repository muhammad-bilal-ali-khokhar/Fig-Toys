appId: com.fig.pos
productName: Fig POS
copyright: Copyright © 2026 MYKO Pvt Ltd. All rights reserved.
directories:
  output: release
  buildResources: build

files:
  - main.js
  - preload.js
  - logging.js
  - report.js
  - content-update.js
  - loading.html
  - about.html
  - icon.png
  - spalsh_1.png
  - spalsh_2.png
  - error.html
  - runtime.json
  - package.json
  - dev-app-update.yml

# Bundle the production builds (no source, no node_modules except the native
# module bundled inside production/backend/native).
extraResources:
  - from: ../production/backend
    to: production/backend
    filter:
      - "**/*"
  - from: ../production/frontend
    to: production/frontend
    filter:
      - "**/*"

npmRebuild: true

# OTA updates via GitHub Releases. electron-builder generates latest.yml +
# blockmap so installed apps can self-update without re-downloading.
publish:
  provider: github
  owner: arsalanwahab
  repo: Mobile-Shop-POS

# Windows is the only release target. macOS is not built or released.
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: Fig-POS-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Fig POS
  license: build/license.txt
  installerSidebar: build/installerSidebar.bmp
  installerHeaderIcon: build/installerHeaderIcon.ico
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
  runAfterFinish: true