<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
html,body{margin:0;height:100%;background:transparent;font-family:Montserrat,system-ui,sans-serif;overflow:hidden}
.canvas{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:transparent}
.card{width:420px;background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 20px 40px rgba(0,0,0,0.15);text-align:center}
.spinner{width:32px;height:32px;border:3px solid #f3efe7;border-top-color:#9b3f68;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;font-size:16px;color:#1c1916;font-weight:700}
p{margin:8px 0 0;font-size:12px;color:#7d7467;line-height:1.5}
.small{margin-top:10px;font-size:11px;color:#aaa08f}
</style>
</head>
<body>
<div class="canvas">
  <div class="card">
    <div class="spinner"></div>
    <h1 id="title">Installing update…</h1>
    <p id="subtitle">Please wait — Fig POS will restart automatically.<br>Do not turn off your computer.</p>
    <p class="small" id="detail"></p>
  </div>
</div>
<script>
const q = new URLSearchParams(window.location.search);
const v = q.get("v");
if (v) document.getElementById("title").textContent = `Installing update v${v}…`;
if (window.updater && window.updater.onStatus) {
  window.updater.onStatus((s) => {
    const d = document.getElementById("detail");
    if (s) d.textContent = s;
  });
}
</script>
</body>
</html>
