    <main>

    <script>
        // Load release data from the bucket via script tags (bypasses CORS).
        window.FIG_VERSIONS = null;
    </script>
    <script src="https://download.myko.pk/versions.js?v=20260818" defer></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            function renderDescription(container, description) {
                if (!description) return;
                const bullets = [];
                String(description)
                    .replace(/\r/g, "")
                    .split("\n")
                    .map((l) => l.trim())
                    .forEach((line) => {
                        if (line.startsWith("-")) {
                            bullets.push(line);
                        } else if (line.length > 0 && bullets.length) {
                            bullets[bullets.length - 1] += " " + line;
                        }
                    });
                const ul = document.createElement("ul");
                ul.className = "text-sm text-ink-600 leading-relaxed max-w-2xl list-disc pl-5 text-left";
                bullets.forEach((line) => {
                    const li = document.createElement("li");
                    li.className = "mt-1.5";
                    li.textContent = line
                        .replace(/^\s*-\s*/, "")
                        .replace(/\*\*/g, "")
                        .replace(/`([^`]*)`/g, "$1");
                    ul.append(li);
                });
                container.replaceChildren(ul);
            }

            const versions = (window.FIG_VERSIONS && window.FIG_VERSIONS.versions) || [];
            const host = document.getElementById("version-history");
            if (versions.length) {
                const rows = versions.map((v) => {
                    const el = document.createElement("div");
                    el.className = "bg-ink-100 border border-ink-200 rounded-2xl p-6";
                    const title = document.createElement("div");
                    title.className = "flex flex-wrap items-center gap-3 mb-1";
                    const name = document.createElement("span");
                    name.className = "font-semibold text-ink-950";
                    name.textContent = "v" + v.version;
                    const date = document.createElement("span");
                    date.className = "text-sm text-ink-500";
                    date.textContent = v.publishedAt
                        ? new Date(v.publishedAt).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })
                        : "";
                    const size = document.createElement("span");
                    size.className = "text-sm text-ink-500";
                    size.textContent = v.size ? v.size + " · 64-bit" : "";
                    title.append(name, date, size);
                    el.append(title);
                    if (v.description) {
                        const desc = document.createElement("div");
                        desc.className = "mt-3";
                        renderDescription(desc, v.description);
                        el.append(desc);
                    }
                    const link = document.createElement("a");
                    link.className = "inline-block mt-4 bg-brand-600 text-ink-50 px-5 py-2.5 rounded-full text-sm font-medium hover:bg-brand-700 transition-colors border border-brand-700";
                    link.href = v.url.setup;
                    link.textContent = "Download v" + v.version;
                    link.setAttribute("download", "");
                    link.rel = "noopener";
                    el.append(link);
                    return el;
                });
                host.replaceChildren(...rows);
            } else {
                const empty = document.createElement("p");
                empty.className = "text-ink-500";
                empty.textContent = "No releases found yet.";
                host.replaceChildren(empty);
            }
        });
    </script>
