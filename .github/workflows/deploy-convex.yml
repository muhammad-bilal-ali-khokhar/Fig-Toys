name: Deploy Convex license server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-convex
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: convex
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: convex/package-lock.json

      - name: Install
        run: npm ci

      - name: Deploy to production
        run: npx convex deploy --yes --typecheck disable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
