name: Deploy owner console

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-owner-console
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy
        run: npm run deploy

      - name: Set worker secrets
        env:
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          LICENSE_ADMIN_TOKEN: ${{ secrets.LICENSE_ADMIN_TOKEN }}
          ADMIN_EMAIL: ${{ secrets.OWNER_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.OWNER_ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.OWNER_ADMIN_SESSION_SECRET }}
        run: |
          printf '%s' "$CONVEX_SITE_URL" | npx wrangler secret put CONVEX_SITE_URL
          printf '%s' "$LICENSE_ADMIN_TOKEN" | npx wrangler secret put LICENSE_ADMIN_TOKEN
          printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          printf '%s' "$ADMIN_SESSION_SECRET" | npx wrangler secret put ADMIN_SESSION_SECRET
