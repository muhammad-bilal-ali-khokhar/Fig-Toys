name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (semver like 1.2.3). Leave empty to auto-bump the patch."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Bump the version, regenerate the changelog, and push a tag. The tag is then
  # used by the build job below. No tag trigger on this workflow, so pushing it
  # never re-triggers the run.
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            CURRENT=$(node -p "require('./desktop/package.json').version")
            VERSION=$(node -e "
              let [m,j,p]=process.argv[1].split('.').map(Number);
              p+=1;
              if (p>=100) { p=0; j+=1; }
              if (j>=100) { j=0; m+=1; }
              console.log(m+'.'+j+'.'+p);
            " "$CURRENT")
          fi
          ./scripts/version.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: ./scripts/changelog.sh "${{ steps.version.outputs.version }}"

      # Build the Release body from the curated, human-written notes (docs/
      # RELEASE_NOTES.md) — the newest section up to the next version heading —
      # instead of the raw auto-generated commit dump.
      - name: Build curated release notes
        run: |
          awk 'BEGIN{p=0} /^## Unreleased/{p=1; next} /^## /{if(p)exit} p' docs/RELEASE_NOTES.md > .release-notes.md
          echo "--- release notes preview ---"
          cat .release-notes.md

      # Cut the human-written release notes: rename the top "## Unreleased"
      # section to the version being released and start a fresh (empty)
      # "## Unreleased" for the next cycle. This keeps each release's
      # description to only its own notes, so publish-to-r2.mjs doesn't dump
      # older releases' notes into the newest version.
      - name: Cut release notes section
        run: |
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const f = "docs/RELEASE_NOTES.md";
            const lines = fs.readFileSync(f, "utf8").split("\n");
            const i = lines.findIndex((l) => l.trim() === "## Unreleased");
            if (i === -1) { console.log("No ## Unreleased section; skipping"); process.exit(0); }
            let j = -1;
            for (let k = i + 1; k < lines.length; k++) {
              if (/^## /.test(lines[k])) { j = k; break; }
            }
            if (j === -1) j = lines.length;
            const body = lines.slice(i + 1, j).join("\n").trim();
            const rest = lines.slice(j).join("\n").trim();
            const out = "## Unreleased\n\n## v" + version + "\n\n" + body + "\n\n" + rest + "\n";
            fs.writeFileSync(f, out);
            console.log("Cut ## Unreleased into ## v" + version);
          ' "${{ steps.version.outputs.version }}"

      - name: Commit + tag
        run: |
          git add backend/package.json frontend/package.json desktop/package.json CHANGELOG.md .release-notes.md docs/RELEASE_NOTES.md
          git commit -m "v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin main --tags

      - name: Notify owner console of release failure
        if: failure()
        env:
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          LICENSE_ADMIN_TOKEN: ${{ secrets.LICENSE_ADMIN_TOKEN }}
        run: |
          if [ -z "$CONVEX_SITE_URL" ] || [ -z "$LICENSE_ADMIN_TOKEN" ]; then exit 0; fi
          curl -sS -X POST "${CONVEX_SITE_URL%/}/admin/mutate" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LICENSE_ADMIN_TOKEN" \
            --data '{"type":"createReleaseNotification","actor":"GitHub Actions","payload":{"status":"failed"}}'

  # Build the Windows installer from the newly-created tag and publish the
  # GitHub Release (installer + latest.yml + blockmap for OTA self-updates).
  build:
    needs: release
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.release.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci && npx prisma generate

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:47620
        run: npm run build

      # Prepare the self-contained production frontend bundle (renames
      # node_modules -> deps so electron-builder doesn't prune 'next'). Must run
      # after npm run build.
      - name: Prepare production frontend bundle
        working-directory: frontend
        run: npm run build:production

      # Rebuild the backend's native module (better-sqlite3) for Windows + Electron.
      - name: Rebuild native modules
        working-directory: desktop
        run: npm run rebuild

      # Bundle the self-contained production backend (esbuild + native module +
      # schema.sql + setup.cjs) into production/backend.
      - name: Build production backend
        working-directory: backend
        run: npm run build:production

      - name: Configure production license server
        working-directory: desktop
        env:
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
        run: |
          if [ -z "$CONVEX_SITE_URL" ]; then
            echo "Missing repository variable CONVEX_SITE_URL (production Convex site URL)."
            exit 1
          fi
          case "$CONVEX_SITE_URL" in
            *localhost*|*127.0.0.1*) echo "Refusing to release with a local Convex URL."; exit 1 ;;
            *fiery-panda-147*) echo "Refusing to release with the dev Convex URL."; exit 1 ;;
          esac
          export REDEEM_URL="${CONVEX_SITE_URL%/}/redeem"
          node -e 'require("fs").writeFileSync("cloud.json", JSON.stringify({ licenseRedeemUrl: process.env.REDEEM_URL }, null, 2))'

      - name: Package installer
        working-directory: desktop
        run: npm run dist:win

      # Unpacked build — lets you test on Windows with NO installation: extract
      # the zip and run "Fig Mobile POS.exe" directly.
      - name: Build unpacked (no-install) test build
        working-directory: desktop
        run: npm run pack:win

      - name: Zip unpacked test build
        working-directory: desktop
        run: |
          VERSION=$(node -p "require('./package.json').version")
          tar -a -c -f "release/Fig.Mobile.POS-${VERSION}-no-install.zip" -C release/win-unpacked .

      - name: Upload installer
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: fig-pos-setup
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: |
            desktop/release/*.exe
            desktop/release/latest.yml
            desktop/release/*.exe.blockmap
          body_path: .release-notes.md

      # Publish the installer + auto-update files + latest.json to the public
      # Cloudflare R2 bucket so the download page (Cloudflare Pages) can serve
      # them and the desktop app can self-update over OTA.
      - name: Publish to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_VERSION: ${{ needs.release.outputs.version }}
          R2_SOURCE_DIR: desktop/release
        run: node scripts/publish-to-r2.mjs

      - name: Notify owner console of build failure
        if: failure()
        env:
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          LICENSE_ADMIN_TOKEN: ${{ secrets.LICENSE_ADMIN_TOKEN }}
        run: |
          if [ -z "$CONVEX_SITE_URL" ] || [ -z "$LICENSE_ADMIN_TOKEN" ]; then exit 0; fi
          curl -sS -X POST "${CONVEX_SITE_URL%/}/admin/mutate" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LICENSE_ADMIN_TOKEN" \
            --data '{"type":"createReleaseNotification","actor":"GitHub Actions","payload":{"version":"${{ needs.release.outputs.version }}","status":"failed"}}'